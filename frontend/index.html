<!DOCTYPE html>
<html>
<head>
  <title>✈️ Travel Planning Engine</title>
  <style>
    * { font-family: Arial; margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    h1 { color: #333; margin-bottom: 10px; text-align: center; font-size: 2.5em; }
    .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
    .form-container { background: #f8f9fa; padding: 30px; border-radius: 8px; margin-bottom: 30px; }
    .form-group { margin: 15px 0; }
    label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
    input, select { width: 100%; padding: 12px; margin: 5px 0; border: 2px solid #ddd; border-radius: 6px; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: #667eea; }
    button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px 40px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4); }
    .itinerary { margin-top: 30px; }
    .itinerary h2 { color: #333; margin-bottom: 20px; }
    .day-card { border-left: 5px solid #667eea; padding: 20px; margin: 15px 0; border-radius: 6px; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); }
    .day-card h3 { color: #667eea; margin-bottom: 15px; }
    .activity { padding: 12px; background: white; margin: 8px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .activity-name { font-weight: bold; color: #333; }
    .activity-time { color: #999; font-size: 0.9em; }
    .activity-cost { color: #28a745; font-weight: bold; }
    .day-total { margin-top: 12px; padding-top: 12px; border-top: 2px solid #ddd; font-weight: bold; color: #667eea; }
    .trips-list { margin-top: 30px; }
    .trip-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; margin: 10px 0; border-radius: 8px; }
    .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 6px; margin: 15px 0; }
    .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 6px; margin: 15px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✈️ Travel Planning Engine</h1>
    <p class="subtitle">Plan your perfect trip with AI-powered itineraries</p>
    
    <div class="form-container">
      <h2>Create Your Trip</h2>
      
      <div class="form-group">
        <label>🌍 Destination:</label>
        <select id="destination">
          <option>Paris</option>
          <option>New York</option>
          <option>Tokyo</option>
        </select>
      </div>

      <div class="form-group">
        <label>📅 Start Date:</label>
        <input type="date" id="startDate">
      </div>

      <div class="form-group">
        <label>📅 End Date:</label>
        <input type="date" id="endDate">
      </div>

      <div class="form-group">
        <label>💰 Budget ($):</label>
        <input type="number" id="budget" value="2000" min="100">
      </div>

      <button onclick="generateTrip()" id="generateBtn">🚀 Generate Itinerary</button>
    </div>

    <div id="message"></div>
    <div id="itinerary" class="itinerary"></div>
    <div id="trips" class="trips-list"></div>
  </div>

  <script>
    let trips = [];

    async function generateTrip() {
      const destination = document.getElementById('destination').value;
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const budget = parseInt(document.getElementById('budget').value);

      if (!startDate || !endDate) {
        showMessage('Please select both dates!', 'error');
        return;
      }

      const data = { destination, startDate, endDate, budget };

      try {
        const res1 = await fetch('http://localhost:5000/api/trips', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const trip = await res1.json();

        const res2 = await fetch(`http://localhost:5000/api/trips/${trip.id}/itinerary`, {
          method: 'POST'
        });

        const itinData = await res2.json();

        let html = `<h2>🗺️ Your ${destination} Itinerary</h2>`;
        let totalCost = 0;

        itinData.itinerary.forEach(day => {
          html += `<div class="day-card"><h3>Day ${day.day}</h3>`;
          day.activities.forEach(act => {
            html += `<div class="activity"><div><div class="activity-time">${act.time}</div><div class="activity-name">${act.name}</div></div><div class="activity-cost">$${act.cost}</div></div>`;
            totalCost += act.cost;
          });
          html += `<p class="day-total">💰 Day ${day.day}: $${day.cost}</p></div>`;
        });

        html += `<p style="margin-top: 20px; font-weight: bold; color: #667eea;">💳 Total: $${totalCost}</p>`;
        document.getElementById('itinerary').innerHTML = html;

        trips.unshift(trip);
        updateTripsList();
        showMessage(`✅ Itinerary generated!`, 'success');
      } catch (error) {
        showMessage('❌ Error: Backend not running on localhost:5000', 'error');
      }
    }

    function updateTripsList() {
      if (trips.length === 0) return;
      let html = `<h3>📝 Your Trips (${trips.length})</h3>`;
      trips.forEach((trip, idx) => {
        html += `<div class="trip-card"><strong>#${idx + 1} - ${trip.destination}</strong><br>📅 ${trip.startDate} to ${trip.endDate}<br>💰 Budget: $${trip.budget}</div>`;
      });
      document.getElementById('trips').innerHTML = html;
    }

    function showMessage(msg, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.innerHTML = `<div class="${type}">${msg}</div>`;
      setTimeout(() => { messageDiv.innerHTML = ''; }, 5000);
    }
  </script>
</body>
</html>
